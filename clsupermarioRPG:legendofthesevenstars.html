<!DOCTYPE html>
<html>
<head>
<title>Super Mario RPG Launcher</title>

<style>
body{
    margin:0;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    font-family:Arial;
}

button{
    padding:30px 50px;
    font-size:32px;
    font-weight:bold;
    border:none;
    border-radius:20px;
    background:#00d4ff;
    cursor:pointer;
    box-shadow:0 0 20px #00d4ff;
}
</style>
</head>

<body>

<button onclick="launchGame()">
OPEN SUPER MARIO RPG
</button>

<script>

async function launchGame(){

    if(document.documentElement.requestFullscreen){
        await document.documentElement.requestFullscreen();
    }

    const win = window.open(
        "https://playclassic.games/games/role-playing-rpg-snes-games-online/play-super-mario-rpg-legend-of-the-seven-stars-online/play/",
        "_blank"
    );

    if(!win){
        alert("Allow popups first");
    }
}

</script>

</body>
</html>
