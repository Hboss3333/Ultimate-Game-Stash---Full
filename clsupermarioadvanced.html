<!DOCTYPE html>
<html>
<head>
<title>Super Mario Advance Launcher</title>

<style>
body{
    margin:0;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    font-family:Arial;
}

button{
    padding:30px 50px;
    font-size:32px;
    font-weight:bold;
    border:none;
    border-radius:20px;
    background:#ffcc00;
    color:black;
    cursor:pointer;
    box-shadow:0 0 25px #ffcc00;
}
</style>
</head>

<body>

<button onclick="launchGame()">
OPEN SUPER MARIO ADVANCE
</button>

<script>

async function launchGame(){

    /* fullscreen current page */

    if(document.documentElement.requestFullscreen){
        await document.documentElement.requestFullscreen();
    }

    /* open game */

    const win = window.open(
        "https://www.smbgames.be/super-mario-advance.php",
        "_blank"
    );

    if(!win){
        alert("Allow popups first");
    }
}

</script>

</body>
</html>
