<!DOCTYPE html>
<html>
<head>
<title>Mario Power Tennis Launcher</title>

<style>
body{
    margin:0;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    font-family:Arial;
}

button{
    padding:30px 50px;
    font-size:32px;
    font-weight:bold;
    border:none;
    border-radius:20px;
    background:#00aaff;
    color:white;
    cursor:pointer;
    box-shadow:0 0 25px #00aaff;
}
</style>
</head>

<body>

<button onclick="launchGame()">
OPEN MARIO POWER TENNIS
</button>

<script>

async function launchGame(){

    if(document.documentElement.requestFullscreen){
        await document.documentElement.requestFullscreen();
    }

    const win = window.open(
        "https://www.snokido.com/game/mario-power-tennis",
        "_blank"
    );

    if(!win){
        alert("Allow popups first");
    }
}

</script>

</body>
</html>
