<!DOCTYPE html>
<html>
<head>
<title>Mario Teaches Typing Launcher</title>

<style>
body{
    margin:0;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    font-family:Arial;
}

button{
    padding:30px 50px;
    font-size:32px;
    font-weight:bold;
    border:none;
    border-radius:20px;
    background:#00d4ff;
    cursor:pointer;
}
</style>
</head>

<body>

<button onclick="launchGame()">
OPEN MARIO TEACHES TYPING
</button>

<script>

async function launchGame(){

    /* fullscreen current page */

    if(document.documentElement.requestFullscreen){
        await document.documentElement.requestFullscreen();
    }

    /* open game */

    const win = window.open(
        "https://playclassic.games/games/educational-dos-games-online/play-mario-teaches-typing-online/play/",
        "_blank"
    );

    if(!win){
        alert("Allow popups first");
    }
}

</script>

</body>
</html>
