<!DOCTYPE html>
<html>
<head>
<title>Yoshi's Universal Gravitation Launcher</title>

<style>
body{
    margin:0;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    font-family:Arial;
}

button{
    padding:30px 50px;
    font-size:32px;
    font-weight:bold;
    border:none;
    border-radius:20px;
    background:#66ff66;
    color:black;
    cursor:pointer;
    box-shadow:0 0 25px #66ff66;
}
</style>
</head>

<body>

<button onclick="launchGame()">
OPEN YOSHI'S UNIVERSAL GRAVITATION
</button>

<script>

async function launchGame(){

    /* fullscreen current page */

    if(document.documentElement.requestFullscreen){
        await document.documentElement.requestFullscreen();
    }

    /* open game */

    const win = window.open(
        "https://www.retrogames.cc/gameboyadvance-games/yoshi-s-universal-gravitation-e-endless-piracy.html",
        "_blank"
    );

    if(!win){
        alert("Allow popups first");
    }
}

</script>

</body>
</html>
